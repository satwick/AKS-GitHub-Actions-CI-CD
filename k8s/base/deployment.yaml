apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: default
  labels:
    app: demo-api
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
        version: v1
    spec:
      # Pod Anti-Affinity: Ensure pods are distributed across different nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - demo-api
              topologyKey: kubernetes.io/hostname
      
      # Security Context: Run as non-root user
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
      
      containers:
      - name: demo-api
        image: <ACR_NAME>.azurecr.io/demo-api:latest
        imagePullPolicy: Always
        
        # Container Security Context
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        # Liveness Probe: Check if container is alive
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness Probe: Check if container is ready to serve traffic
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        
        # Resource Limits and Requests
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Environment Variables
        env:
        - name: PORT
          value: "8080"
        - name: ENVIRONMENT
          value: "dev"
        - name: LOG_LEVEL
          value: "info"
        
        # Volume Mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
      
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      
      # Image Pull Secrets for private container registry
      imagePullSecrets:
      - name: acr-secret
