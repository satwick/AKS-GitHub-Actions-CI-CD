apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-api
  namespace: default
  labels:
    app: demo-api
  annotations:
    # Azure Application Gateway Ingress Controller annotations
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/backend-path-prefix: "/"
    appgw.ingress.kubernetes.io/request-timeout: "60"
    appgw.ingress.kubernetes.io/health-probe-path: "/health/ready"
    appgw.ingress.kubernetes.io/use-private-ip: "false"
    # SSL/TLS Configuration
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    # Uncomment and configure for production with actual certificate
    # appgw.ingress.kubernetes.io/appgw-ssl-certificate: "your-cert-name"
spec:
  rules:
  - host: demo-api.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: demo-api
            port:
              number: 80
