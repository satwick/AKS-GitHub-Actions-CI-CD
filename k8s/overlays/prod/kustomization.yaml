apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
- ../../base

namePrefix: prod-

commonLabels:
  environment: production

replicas:
- name: demo-api
  count: 5

patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: <ACR_NAME>.azurecr.io/demo-api:latest-prod
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: production
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 512Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 250m
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 1Gi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 1000m
  target:
    kind: Deployment
    name: demo-api

- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: demo-api.example.com
    - op: replace
      path: /metadata/annotations/appgw.ingress.kubernetes.io~1appgw-ssl-certificate
      value: prod-ssl-cert
  target:
    kind: Ingress
    name: demo-api

- patch: |-
    - op: replace
      path: /spec/minAvailable
      value: 2
  target:
    kind: PodDisruptionBudget
    name: demo-api
