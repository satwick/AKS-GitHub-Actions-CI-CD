apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
- ../../base

namePrefix: staging-

commonLabels:
  environment: staging

replicas:
- name: demo-api
  count: 3

patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: <ACR_NAME>.azurecr.io/demo-api:latest-staging
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: staging
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 512Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 1Gi
  target:
    kind: Deployment
    name: demo-api

- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: demo-api-staging.example.com
  target:
    kind: Ingress
    name: demo-api
