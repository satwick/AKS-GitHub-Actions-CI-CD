name: AKS CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  ACR_NAME: <YOUR_ACR_NAME>
  APP_NAME: demo-api

jobs:
  # Build and push Docker image to Azure Container Registry
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      environment: ${{ steps.set-env.outputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Determine environment
      id: set-env
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          ENV="${{ github.event.inputs.environment }}"
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENV="prod"
        elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
          ENV="staging"
        else
          ENV="dev"
        fi
        echo "environment=$ENV" >> $GITHUB_OUTPUT
        echo "Deploying to environment: $ENV"
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.ACR_NAME }}.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
    
    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}
        tags: |
          type=sha,prefix=${{ steps.set-env.outputs.environment }}-
          type=raw,value=latest-${{ steps.set-env.outputs.environment }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:buildcache
        cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:buildcache,mode=max
        platforms: linux/amd64
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:latest-${{ steps.set-env.outputs.environment }}
        format: 'sarif'
        output: 'trivy-results.sarif'
      env:
        TRIVY_USERNAME: ${{ secrets.ACR_USERNAME }}
        TRIVY_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Deploy to AKS using Helm with Kustomize
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ needs.build.outputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set environment variables
      run: |
        ENV="${{ needs.build.outputs.environment }}"
        echo "ENVIRONMENT=$ENV" >> $GITHUB_ENV
        
        case $ENV in
          prod)
            echo "AKS_CLUSTER=aks-prod-cluster" >> $GITHUB_ENV
            echo "AKS_RESOURCE_GROUP=rg-prod" >> $GITHUB_ENV
            echo "NAMESPACE=production" >> $GITHUB_ENV
            echo "HELM_RELEASE=demo-api-prod" >> $GITHUB_ENV
            ;;
          staging)
            echo "AKS_CLUSTER=aks-staging-cluster" >> $GITHUB_ENV
            echo "AKS_RESOURCE_GROUP=rg-staging" >> $GITHUB_ENV
            echo "NAMESPACE=staging" >> $GITHUB_ENV
            echo "HELM_RELEASE=demo-api-staging" >> $GITHUB_ENV
            ;;
          *)
            echo "AKS_CLUSTER=aks-dev-cluster" >> $GITHUB_ENV
            echo "AKS_RESOURCE_GROUP=rg-dev" >> $GITHUB_ENV
            echo "NAMESPACE=dev" >> $GITHUB_ENV
            echo "HELM_RELEASE=demo-api-dev" >> $GITHUB_ENV
            ;;
        esac
    
    - name: Azure login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Set AKS context
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ env.AKS_RESOURCE_GROUP }}
        cluster-name: ${{ env.AKS_CLUSTER }}
    
    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'
    
    - name: Create namespace if not exists
      run: |
        kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Create ACR secret
      run: |
        kubectl create secret docker-registry acr-secret \
          --docker-server=${{ env.ACR_NAME }}.azurecr.io \
          --docker-username=${{ secrets.ACR_USERNAME }} \
          --docker-password=${{ secrets.ACR_PASSWORD }} \
          --namespace=${{ env.NAMESPACE }} \
          --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Generate Kustomize manifests
      run: |
        # Update image in kustomization
        cd k8s/overlays/${{ env.ENVIRONMENT }}
        kustomize edit set image <ACR_NAME>.azurecr.io/${{ env.APP_NAME }}=${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:latest-${{ env.ENVIRONMENT }}
        
        # Build and save manifests
        kustomize build . > /tmp/kustomize-manifests.yaml
        
        echo "Generated manifests:"
        cat /tmp/kustomize-manifests.yaml
    
    - name: Deploy to AKS using Helm
      run: |
        # Deploy with Helm, passing Kustomize manifests as a value
        helm upgrade --install ${{ env.HELM_RELEASE }} ./helm-chart \
          --namespace ${{ env.NAMESPACE }} \
          --create-namespace \
          --values ./helm-chart/values-${{ env.ENVIRONMENT }}.yaml \
          --set-file kustomizeManifests=/tmp/kustomize-manifests.yaml \
          --wait \
          --timeout 5m \
          --atomic \
          --cleanup-on-fail
        
        echo "✅ Deployment successful!"
        echo "Release: ${{ env.HELM_RELEASE }}"
        echo "Namespace: ${{ env.NAMESPACE }}"
    
    - name: Verify deployment
      run: |
        # Check Helm release status
        helm status ${{ env.HELM_RELEASE }} --namespace ${{ env.NAMESPACE }}
        
        # Verify deployment rollout
        kubectl rollout status deployment/${{ env.ENVIRONMENT }}-demo-api \
          --namespace=${{ env.NAMESPACE }} \
          --timeout=5m
    
    - name: Get deployment info
      if: always()
      run: |
        echo "=== Helm Release Info ==="
        helm list --namespace ${{ env.NAMESPACE }}
        echo ""
        echo "=== Pods ==="
        kubectl get pods -n ${{ env.NAMESPACE }} -l app=demo-api
        echo ""
        echo "=== Services ==="
        kubectl get svc -n ${{ env.NAMESPACE }} -l app=demo-api
        echo ""
        echo "=== Ingress ==="
        kubectl get ingress -n ${{ env.NAMESPACE }} -l app=demo-api
        echo ""
        echo "=== Helm History ==="
        helm history ${{ env.HELM_RELEASE }} --namespace ${{ env.NAMESPACE }}

  # Rollback job (can be triggered manually or on failure)
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure() && github.event_name != 'pull_request'
    environment: ${{ needs.build.outputs.environment }}
    
    steps:
    - name: Set environment variables
      run: |
        ENV="${{ needs.build.outputs.environment }}"
        echo "ENVIRONMENT=$ENV" >> $GITHUB_ENV
        
        case $ENV in
          prod)
            echo "AKS_CLUSTER=aks-prod-cluster" >> $GITHUB_ENV
            echo "AKS_RESOURCE_GROUP=rg-prod" >> $GITHUB_ENV
            echo "NAMESPACE=production" >> $GITHUB_ENV
            echo "HELM_RELEASE=demo-api-prod" >> $GITHUB_ENV
            ;;
          staging)
            echo "AKS_CLUSTER=aks-staging-cluster" >> $GITHUB_ENV
            echo "AKS_RESOURCE_GROUP=rg-staging" >> $GITHUB_ENV
            echo "NAMESPACE=staging" >> $GITHUB_ENV
            echo "HELM_RELEASE=demo-api-staging" >> $GITHUB_ENV
            ;;
          *)
            echo "AKS_CLUSTER=aks-dev-cluster" >> $GITHUB_ENV
            echo "AKS_RESOURCE_GROUP=rg-dev" >> $GITHUB_ENV
            echo "NAMESPACE=dev" >> $GITHUB_ENV
            echo "HELM_RELEASE=demo-api-dev" >> $GITHUB_ENV
            ;;
        esac
    
    - name: Azure login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Set AKS context
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ env.AKS_RESOURCE_GROUP }}
        cluster-name: ${{ env.AKS_CLUSTER }}
    
    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'
    
    - name: Rollback to previous release
      run: |
        echo "⚠️ Deployment failed, rolling back..."
        
        # Get current revision
        CURRENT_REVISION=$(helm history ${{ env.HELM_RELEASE }} --namespace ${{ env.NAMESPACE }} --max 1 -o json | jq -r '.[0].revision')
        PREVIOUS_REVISION=$((CURRENT_REVISION - 1))
        
        if [ $PREVIOUS_REVISION -gt 0 ]; then
          echo "Rolling back from revision $CURRENT_REVISION to $PREVIOUS_REVISION"
          helm rollback ${{ env.HELM_RELEASE }} $PREVIOUS_REVISION --namespace ${{ env.NAMESPACE }} --wait
          echo "✅ Rollback successful!"
        else
          echo "❌ No previous revision to rollback to"
          exit 1
        fi
    
    - name: Verify rollback
      run: |
        echo "=== Rollback Status ==="
        helm status ${{ env.HELM_RELEASE }} --namespace ${{ env.NAMESPACE }}
        
        echo ""
        echo "=== Deployment Status ==="
        kubectl get deployment -n ${{ env.NAMESPACE }} -l app=demo-api
        
        echo ""
        echo "=== Helm History ==="
        helm history ${{ env.HELM_RELEASE }} --namespace ${{ env.NAMESPACE }}

